<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .kin{width:100%;font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:12px 0;min-height:54px;-webkit-appearance:none;appearance:none}
  .kin:focus{outline:none;border-bottom:2px solid var(--oznaka)}
  .kin[aria-invalid="true"]{border-bottom:2px solid #A33A22}
</style>
</helmet>
<dc-import name="KvHeader" active="kontakt" hint-size="100%,136px"></dc-import>
<main>
  <section style="padding:clamp(56px,11svh,130px) 0 clamp(48px,8svh,90px)">
    <div class="g12" style="row-gap:24px;align-items:end"><div style="grid-column:1 / span 8"><span class="km" style="color:var(--oznaka)">A-05 · Kontakt · 44.8235° N, 20.4640° E</span><h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(88px,11vw,200px);line-height:0.88;letter-spacing:-0.025em;margin:20px 0 0">Zakažite <span style="font-style:italic;color:var(--oznaka)">razgledanje.</span></h1></div></div>
  </section>
  <section style="border-top:1px solid var(--ink);padding:clamp(56px,10svh,110px) 0 clamp(96px,18svh,200px)">
    <div class="g12" style="row-gap:48px">
      <div style="grid-column:1 / span 7">
        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}"><div role="status" style="padding:clamp(28px,4vw,56px);background:var(--sumrak);color:var(--pesak)"><span class="km" style="color:var(--sunce)">Upit je primljen · {{ ref }}</span><p style="font-family:var(--serif);font-weight:300;font-size:clamp(34px,3.4vw,56px);line-height:1.05;margin:14px 0 22px">Hvala, {{ ime }}. Javljamo se danas sa dva termina.</p><a class="km hv" href="hvala.html?ime={{ ime }}&amp;n={{ ref }}" style="display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border:1px solid var(--pesak);color:var(--pesak)" style-hover="background:var(--pesak);color:var(--sumrak)">Šta sledi →</a></div></sc-if>
        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <form novalidate="" onSubmit="{{ submit }}" aria-label="Upit za razgledanje" class="stk" style="display:grid;grid-template-columns:1fr 1fr;gap:30px 24px">
            <label class="km" style="display:flex;flex-direction:column;gap:8px">Ime i prezime<input class="kin" name="ime" autocomplete="name" value="{{ f.ime }}" onChange="{{ on.ime }}" aria-invalid="{{ inv.ime }}"><span style="font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:13px;color:#A33A22;min-height:16px">{{ err.ime }}</span></label>
            <label class="km" style="display:flex;flex-direction:column;gap:8px">Telefon<input class="kin" type="tel" name="tel" autocomplete="tel" value="{{ f.tel }}" onChange="{{ on.tel }}" aria-invalid="{{ inv.tel }}"><span style="font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:13px;color:#A33A22;min-height:16px">{{ err.tel }}</span></label>
            <label class="km" style="display:flex;flex-direction:column;gap:8px">Nekretnina<select class="kin" name="n" value="{{ f.n }}" onChange="{{ on.n }}"><option value="A-01">A-01 · Dorćol, 128 m²</option><option value="A-02">A-02 · Vračar, 86 m²</option><option value="A-03">A-03 · Senjak, kuća</option><option value="—">Još tražim</option></select></label>
            <label class="km" style="display:flex;flex-direction:column;gap:8px">Budžet<select class="kin" name="b" value="{{ f.b }}" onChange="{{ on.b }}"><option>do € 150.000</option><option>€ 150—300.000</option><option>€ 300—500.000</option><option>preko € 500.000</option></select></label>
            <label class="km" style="grid-column:1 / -1;display:flex;flex-direction:column;gap:8px">Poruka (opciono)<textarea class="kin" name="p" rows="2" placeholder="Najradije subotom pre podne…" value="{{ f.p }}" onChange="{{ on.p }}" style="resize:vertical"></textarea></label>
            <button type="submit" class="km hv" disabled="{{ loading }}" style="justify-self:start;min-height:58px;padding:0 30px;border:0;cursor:pointer;background:var(--sumrak);color:var(--pesak)" style-hover="background:var(--ink)">{{ btn }}</button>
          </form>
        </sc-if>
      </div>
      <aside class="rv" style="grid-column:9 / span 4;display:flex;flex-direction:column;gap:30px">
        <div><span class="km" style="color:var(--muted)">Kancelarija</span><p style="font-family:var(--serif);font-size:28px;line-height:1.2;margin:10px 0 0">Kralja Petra 52<br>Dorćol, Beograd</p></div>
        <div><span class="km" style="color:var(--muted)">Telefon · email</span><p style="margin:10px 0 0;font-size:17px;line-height:1.8"><a href="tel:+381110000000">011 000 000</a><br><a href="mailto:prostor@kvadrat.rs">prostor@kvadrat.rs</a></p></div>
        <div style="position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:var(--kamen)"><iframe title="Mapa: Kralja Petra, Dorćol" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=20.4580%2C44.8205%2C20.4700%2C44.8265&amp;layer=mapnik&amp;marker=44.8235%2C20.4640" style="position:absolute;inset:0;width:100%;height:100%;border:0;filter:grayscale(1) sepia(0.4) contrast(0.95)"></iframe></div>
      </aside>
    </div>
  </section>
</main>
<dc-import name="KvFooter" hint-size="100%,700px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(p) { super(p); let n = 'A-01'; try { n = new URLSearchParams(window.location.search).get('n') || 'A-01'; } catch(e) {} this.state = { f:{ime:'',tel:'',n,b:'€ 300—500.000',p:''}, err:{}, loading:false, sent:false }; }
  renderVals() {
    const s = this.state;
    const on = {}; Object.keys(s.f).forEach(x => on[x] = ev => { const v = ev.target.value; this.setState(q => { const e = Object.assign({}, q.err); delete e[x]; return { f: Object.assign({}, q.f, {[x]: v}), err: e }; }); });
    const inv = {}; Object.keys(s.err).forEach(x => inv[x] = 'true');
    const submit = ev => { ev.preventDefault(); const e = {}; if (s.f.ime.trim().length < 2) e.ime = 'Upišite ime.'; if (s.f.tel.replace(/\D/g,'').length < 8) e.tel = 'Proverite broj.';
      if (Object.keys(e).length) { this.setState({ err: e }); return; } this.setState({ loading: true }); setTimeout(() => this.setState({ loading: false, sent: true }), 900); };
    return { f: s.f, on, inv, err: Object.assign({ime:'',tel:''}, s.err), submit, sent: s.sent, notSent: !s.sent, ime: s.f.ime.trim().split(' ')[0], ref: s.f.n,
      loading: s.loading || undefined, btn: s.loading ? 'Šaljem upit…' : 'Pošaljite upit' };
  }
}
</script>
</body>
</html>
