<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&amp;family=Karla:wght@400;500;600&amp;family=Azeret+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
  :root{--kamen:#E9DDCB;--pesak:#F4EEE4;--sumrak:#3B3A5C;--sunce:#F2B872;--oznaka:#B5543A;--ink:#2A2622;--muted:#6F655B;--line:rgba(42,38,34,0.18);--serif:'Cormorant Garamond',serif;--sans:'Karla',sans-serif;--mono:'Azeret Mono',monospace;--m:clamp(20px,6vw,104px)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--pesak);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-wrap:pretty}
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--oznaka)}
  ::selection{background:var(--sumrak);color:var(--pesak)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1.5px solid var(--oznaka);outline-offset:4px}
  .g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:0 var(--m)}
  .km{font-family:var(--mono);font-weight:300;font-size:11px;letter-spacing:0.12em;text-transform:uppercase}
  .kota{position:relative;height:1px;background:var(--ink);opacity:0.55}
  .kota::before,.kota::after{content:"";position:absolute;top:-6px;width:1px;height:13px;background:var(--ink)}
  .kota::before{left:0}.kota::after{right:0}
  .hv{transition:color .3s ease,background-color .3s ease,border-color .3s ease}
  html.kj .rv{opacity:0;transition:opacity 1.2s ease}
  html.kj .rv.in{opacity:1}
  .k-t{position:absolute;opacity:0;pointer-events:none}
  .k-menu{display:none}
  .k-t:checked ~ .k-menu{display:flex}
  @media(max-width:1000px){.k-links{display:none !important}.k-burger{display:flex !important}}
  @media(max-width:760px){.g12 > *{grid-column:1 / -1 !important}.hm{display:none !important}.stk{grid-template-columns:1fr !important}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}html.kj .rv{opacity:1;transition:none}.hv{transition:none}}

  html{-webkit-text-size-adjust:100%}
  html,body{overflow-x:clip}
  h1,h2,h3{overflow-wrap:break-word}
  @media(max-width:760px){h1,h2{hyphens:auto;-webkit-hyphens:auto}}
  @media(min-width:1600px){.g12{max-width:1760px;margin-left:auto;margin-right:auto}}
  input,select,textarea{font-size:max(16px,1em)}
  @media(max-width:760px){header > div{min-height:60px !important}}
  html:has(.k-t:checked){overflow:hidden}
  @media(hover:none){.hv:hover{filter:none}}

  @media(max-width:760px){form button[type="submit"]{width:100%;justify-content:center}}
  @supports(padding:env(safe-area-inset-bottom)){footer{padding-bottom:env(safe-area-inset-bottom)}}

  .kv-fbtn{display:none}
  @media(max-width:760px){.kv-fbtn{display:inline-flex !important}.kv-sheet{position:fixed !important;left:0;right:0;bottom:0;top:auto !important;z-index:90;background:var(--pesak);border-top:1px solid var(--ink) !important;box-shadow:0 -30px 60px -30px rgba(42,38,34,0.45);padding-bottom:env(safe-area-inset-bottom);transform:translateY(105%);transition:transform .3s ease}.kv-sheet[data-open="1"]{transform:none}}
  @media(prefers-reduced-motion:reduce){.kv-sheet{transition:none}}
</style>
<script>
(function(){
  if(window.__kvj)return; window.__kvj=true;
  var d=document.documentElement; d.lang='sr';d.classList.add('kj');
  var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -6% 0px'}):null;
  function scan(){document.querySelectorAll('.rv:not([data-r])').forEach(function(el){el.setAttribute('data-r','1');io?io.observe(el):el.classList.add('in');});}
  new MutationObserver(scan).observe(d,{childList:true,subtree:true}); scan();
  setTimeout(function(){document.querySelectorAll('.rv').forEach(function(el){if(el.getBoundingClientRect().top<innerHeight)el.classList.add('in');});},900);
})();
</script>
</helmet>
<div aria-hidden="true" style="height:40px"></div>
<div role="note" style="position:fixed;top:0;left:0;right:0;z-index:70;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px;padding:0 var(--m);background:#14203A;color:#E9EEF8;font-family:'Azeret Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase">
  <a href="../../index.html#radovi" style="display:inline-flex;align-items:center;min-height:40px;color:#E9EEF8" style-hover="color:#9DB6FF">← Nazad na portfolio</a>
  <span class="hm" style="opacity:0.7">Koncept · Justin Strelarac</span>
</div>
<header style="position:relative;z-index:50;background:var(--pesak)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:96px;padding:0 var(--m);border-bottom:1px solid var(--line)">
    <a href="index.html" aria-label="Kvadrat Nekretnine, početna" style="font-family:var(--serif);font-weight:500;font-size:clamp(20px,1.7vw,25px);letter-spacing:0.42em;text-transform:uppercase">Kvadrat</a>
    <nav class="k-links" aria-label="Glavna navigacija" style="display:flex;align-items:center;gap:clamp(22px,3vw,52px)">
      <a class="km hv" href="ponuda.html" aria-current="{{ c.ponuda }}" style="color:{{ col.ponuda }}">Ponuda</a>
      <a class="km hv" href="kvartovi.html" aria-current="{{ c.kvartovi }}" style="color:{{ col.kvartovi }}">Kvartovi</a>
      <a class="km hv" href="prodaja.html" aria-current="{{ c.prodaja }}" style="color:{{ col.prodaja }}">Prodaja</a>
      <a class="km hv" href="o-nama.html" aria-current="{{ c.onama }}" style="color:{{ col.onama }}">O nama</a>
      <a class="km hv" href="kontakt.html" aria-current="{{ c.kontakt }}" style="display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--ink);color:{{ col.kontakt }}" style-hover="background:var(--ink);color:var(--pesak)">Kontakt</a>
    </nav>
    <input type="checkbox" id="k-t" class="k-t" aria-label="Otvori meni">
    <label for="k-t" class="k-burger km" style="display:none;align-items:center;min-height:48px;cursor:pointer">Meni —</label>
    <div class="k-menu" role="dialog" aria-label="Meni" style="position:fixed;inset:0;z-index:80;background:var(--kamen);flex-direction:column;padding:24px var(--m) 32px;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;min-height:48px"><span style="font-family:var(--serif);font-size:20px;letter-spacing:0.42em;text-transform:uppercase">Kvadrat</span><label for="k-t" class="km" style="display:flex;align-items:center;min-height:48px;cursor:pointer">Zatvori ✕</label></div>
      <div class="kota" style="margin:28px 0 8px"></div><span class="km" style="color:var(--muted);text-align:center">Sadržaj monografije</span>
      <nav aria-label="Meni za telefon" style="margin-top:auto;display:flex;flex-direction:column">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.h }}" style="display:grid;grid-template-columns:60px 1fr;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)"><span class="km" style="color:var(--oznaka)">{{ l.n }}</span><span style="font-family:var(--serif);font-weight:300;font-size:clamp(40px,11vw,60px);line-height:1">{{ l.t }}</span></a>
        </sc-for>
      </nav>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;ponuda&quot;,&quot;kvartovi&quot;,&quot;prodaja&quot;,&quot;onama&quot;,&quot;kontakt&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || '';
    const k = ['ponuda','kvartovi','prodaja','onama','kontakt'];
    const c = {}, col = {};
    k.forEach(x => { c[x] = x === a ? 'page' : undefined; col[x] = x === a ? 'var(--oznaka)' : 'var(--ink)'; });
    return { c, col, links: [{n:'A-01',t:'Ponuda',h:'ponuda.html'},{n:'A-02',t:'Kvartovi',h:'kvartovi.html'},{n:'A-03',t:'Prodajte sa nama',h:'prodaja.html'},{n:'A-04',t:'O nama',h:'o-nama.html'},{n:'A-05',t:'Kontakt',h:'kontakt.html'}] };
  }
}
</script>
</body>
</html>
