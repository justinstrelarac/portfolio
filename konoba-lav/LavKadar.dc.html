<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<figure style="margin:0;width:100%;height:100%;display:flex;flex-direction:column">
  <div role="img" aria-label="{{ alt }}" style="position:relative;flex:1 1 auto;min-height:220px;overflow:hidden;background:transparent">
    <sc-if value="{{ is.luk }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;border-radius:999px 999px 0 0;overflow:hidden;background:linear-gradient(180deg,#F2B27E 0%,#E07A4F 52%,#B5462F 72%)">
        <div style="position:absolute;left:50%;top:42%;width:40%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#FBE7C6"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:36%;background:repeating-linear-gradient(180deg,#6B1A22 0 8px,#3E0C12 8px 14px)"></div>
      </div>
    </sc-if>
    <sc-if value="{{ is.sto }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#EADAC2">
        <div style="position:absolute;left:12%;top:16%;width:52%;aspect-ratio:1;border-radius:50%;background:#FBF3E6;box-shadow:inset 0 0 0 10px #F3E6D3"></div>
        <div style="position:absolute;left:24%;top:28%;width:28%;aspect-ratio:1;border-radius:50%;background:#E07A4F"></div>
        <div style="position:absolute;right:10%;top:12%;width:16%;aspect-ratio:1/3;border-radius:40% 40% 8% 8%;background:#6B1A22"></div>
        <div style="position:absolute;right:8%;bottom:10%;width:34%;height:3px;background:#2B0A0E"></div>
        <div style="position:absolute;right:8%;bottom:14%;width:26%;height:3px;background:#2B0A0E"></div>
      </div>
    </sc-if>
    <sc-if value="{{ is.vino }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#3E0C12">
        <div style="position:absolute;left:50%;top:14%;width:38%;height:40%;transform:translateX(-50%);border-radius:0 0 50% 50%;background:linear-gradient(180deg,rgba(243,230,211,0.12) 0 30%,#8E2430 30%)"></div>
        <div style="position:absolute;left:50%;top:54%;width:3px;height:26%;transform:translateX(-50%);background:#F3E6D3"></div>
        <div style="position:absolute;left:50%;bottom:16%;width:24%;height:3px;transform:translateX(-50%);background:#F3E6D3"></div>
      </div>
    </sc-if>
    <sc-if value="{{ is.more }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,#F2B27E 0%,#E07A4F 46%)">
        <div style="position:absolute;left:62%;top:30%;width:18%;aspect-ratio:1;border-radius:50%;background:#FBE7C6"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:46%;background:repeating-linear-gradient(180deg,#6B1A22 0 10px,#3E0C12 10px 18px)"></div>
        <div style="position:absolute;left:10%;bottom:40%;width:30%;height:14%;background:#2B0A0E;clip-path:polygon(0 100%,18% 30%,40% 60%,62% 0,100% 100%)"></div>
      </div>
    </sc-if>
    <sc-if value="{{ is.riba }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#F3E6D3">
        <div style="position:absolute;left:14%;top:38%;width:62%;height:26%;border-radius:50%;background:#6B1A22"></div>
        <div style="position:absolute;left:72%;top:36%;width:16%;height:30%;background:#6B1A22;clip-path:polygon(0 50%,100% 0,100% 100%)"></div>
        <div style="position:absolute;left:24%;top:46%;width:4%;aspect-ratio:1;border-radius:50%;background:#F3E6D3"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:18%;background:repeating-linear-gradient(90deg,#E07A4F 0 2px,transparent 2px 18px)"></div>
      </div>
    </sc-if>
    <sc-if value="{{ is.klapa }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#2B0A0E;display:flex;align-items:flex-end;justify-content:center;gap:5%;padding:0 12%">
        <div style="width:13%;height:52%;border-radius:999px 999px 0 0;background:#6B1A22"></div>
        <div style="width:13%;height:62%;border-radius:999px 999px 0 0;background:#8E2430"></div>
        <div style="width:13%;height:58%;border-radius:999px 999px 0 0;background:#6B1A22"></div>
        <div style="width:13%;height:66%;border-radius:999px 999px 0 0;background:#8E2430"></div>
        <div style="width:13%;height:54%;border-radius:999px 999px 0 0;background:#6B1A22"></div>
        <div style="position:absolute;left:50%;top:12%;width:22%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#E07A4F 0%,rgba(224,122,79,0) 70%)"></div>
      </div>
    </sc-if>
  </div>
  <figcaption class="lbl" style="margin-top:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px"><span>{{ cap }}</span><span aria-hidden="true">{{ meta }}</span></figcaption>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:520},&quot;v&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;luk&quot;,&quot;sto&quot;,&quot;vino&quot;,&quot;more&quot;,&quot;riba&quot;,&quot;klapa&quot;],&quot;default&quot;:&quot;luk&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cap&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sl. 01 — Terasa, 21h&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.v || 'luk';
    const is = {luk:v==='luk',sto:v==='sto',vino:v==='vino',more:v==='more',riba:v==='riba',klapa:v==='klapa'};
    return { is, alt: this.props.alt || '', cap: this.props.cap || '', meta: this.props.meta || '' };
  }
}
</script>
</body>
</html>
