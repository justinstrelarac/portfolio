<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&amp;family=Figtree:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root{--papir:#F3E6D3;--papir2:#EADAC2;--bordo:#6B1A22;--bordo2:#521219;--sunce:#E07A4F;--ink:#2B0A0E;--muted:#6E5048;--line:rgba(43,10,14,0.18);--serif:'Playfair Display',serif;--sans:'Figtree',sans-serif;--mono:'IBM Plex Mono',monospace;--m:clamp(20px,5.5vw,96px)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--papir);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-wrap:pretty}
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--bordo)}
  img{display:block;max-width:100%;height:auto}
  ::selection{background:var(--bordo);color:var(--papir)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--sunce);outline-offset:3px}
  .g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:0 var(--m)}
  .lbl{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase}
  .dots{flex:1;min-width:20px;border-bottom:1px dotted currentColor;opacity:0.45;transform:translateY(-5px)}
  html.lj .rv{opacity:0;transition:opacity 1s ease}
  html.lj .rv.in{opacity:1}
  .hv{transition:color .2s ease,background-color .2s ease,border-color .2s ease}
  .lav-t{position:absolute;opacity:0;pointer-events:none}
  .lav-menu{display:none}
  .lav-t:checked ~ .lav-menu{display:flex}
  .dropcap::first-letter{font-family:var(--serif);font-style:italic;float:left;font-size:5.6em;line-height:0.8;padding:0.06em 0.1em 0 0;color:var(--bordo)}
  @media(max-width:1000px){.lav-links{display:none !important}.lav-burger{display:flex !important}}
  @media(max-width:760px){.g12 > *{grid-column:1 / -1 !important}.hm{display:none !important}.stk{grid-template-columns:1fr !important;gap:10px !important}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}html.lj .rv{opacity:1;transition:none}.hv{transition:none}}

  html{-webkit-text-size-adjust:100%}
  html,body{overflow-x:clip}
  h1,h2,h3{overflow-wrap:break-word}
  @media(max-width:760px){h1,h2{hyphens:auto;-webkit-hyphens:auto}}
  @media(min-width:1600px){.g12{max-width:1760px;margin-left:auto;margin-right:auto}}
  input,select,textarea{font-size:max(16px,1em)}
  @media(max-width:760px){header > div{min-height:60px !important}}
  html:has(.lav-t:checked){overflow:hidden}
  @media(hover:none){.hv:hover{filter:none}}

  @media(max-width:760px){form button[type="submit"]{width:100%;justify-content:center}}
  @supports(padding:env(safe-area-inset-bottom)){footer{padding-bottom:env(safe-area-inset-bottom)}}
</style>
<script>
(function(){
  if(window.__lavj)return; window.__lavj=true;
  var d=document.documentElement; d.lang='sr';d.classList.add('lj');
  var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -6% 0px'}):null;
  function scan(){document.querySelectorAll('.rv:not([data-r])').forEach(function(el){el.setAttribute('data-r','1');io?io.observe(el):el.classList.add('in');});}
  new MutationObserver(scan).observe(d,{childList:true,subtree:true}); scan();
  setTimeout(function(){document.querySelectorAll('.rv').forEach(function(el){if(el.getBoundingClientRect().top<innerHeight)el.classList.add('in');});},900);
})();
</script>
</helmet>
<div aria-hidden="true" style="height:40px"></div>
<div role="note" style="position:fixed;top:0;left:0;right:0;z-index:70;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px;padding:0 var(--m);background:#14203A;color:#E9EEF8;font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase">
  <a href="../../index.html#radovi" style="display:inline-flex;align-items:center;min-height:40px;color:#E9EEF8" style-hover="color:#9DB6FF">← Nazad na portfolio</a>
  <span class="hm" style="opacity:0.7">Koncept · Justin Strelarac</span>
</div>
<header style="position:relative;z-index:50;border-bottom:1px solid var(--line);background:var(--papir)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:88px;padding:0 var(--m)">
    <a href="index.html" aria-label="Konoba Lav, početna" style="font-family:var(--serif);font-weight:500;font-size:clamp(17px,1.5vw,21px);letter-spacing:0.38em;text-transform:uppercase;white-space:nowrap">Konoba&nbsp;Lav</a>
    <nav class="lav-links" aria-label="Glavna navigacija" style="display:flex;align-items:center;gap:clamp(18px,2.4vw,40px)">
      <a class="lbl hv" href="meni.html" aria-current="{{ c.meni }}" style="color:{{ col.meni }}">Meni</a>
      <a class="lbl hv" href="vina.html" aria-current="{{ c.vina }}" style="color:{{ col.vina }}">Vina</a>
      <a class="lbl hv" href="prica.html" aria-current="{{ c.prica }}" style="color:{{ col.prica }}">Priča</a>
      <a class="lbl hv" href="dogadjaji.html" aria-current="{{ c.dogadjaji }}" style="color:{{ col.dogadjaji }}">Događaji</a>
      <a class="lbl hv" href="proslave.html" aria-current="{{ c.proslave }}" style="color:{{ col.proslave }}">Proslave</a>
      <a class="lbl hv" href="kontakt.html" aria-current="{{ c.kontakt }}" style="color:{{ col.kontakt }}">Kontakt</a>
      <a class="lbl hv" href="rezervacija.html" style="color:var(--bordo);border:1px solid var(--bordo);padding:13px 18px" style-hover="background:var(--bordo);color:var(--papir)">Rezervacije →</a>
    </nav>
    <input type="checkbox" id="lav-t" class="lav-t" aria-label="Otvori meni">
    <label for="lav-t" class="lav-burger lbl" style="display:none;align-items:center;gap:10px;min-height:48px;padding:0 4px;cursor:pointer">Meni <span aria-hidden="true" style="font-size:18px">≡</span></label>
    <div class="lav-menu" role="dialog" aria-label="Meni" style="position:fixed;inset:0;z-index:60;background:var(--bordo);color:var(--papir);flex-direction:column;padding:24px var(--m) 32px;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;min-height:48px">
        <span style="font-family:var(--serif);font-size:17px;letter-spacing:0.38em;text-transform:uppercase">Konoba Lav</span>
        <label for="lav-t" class="lbl" style="display:flex;align-items:center;min-height:48px;cursor:pointer">Zatvori ✕</label>
      </div>
      <nav aria-label="Meni za telefon" style="display:flex;flex-direction:column;margin-top:auto;border-top:1px solid rgba(243,230,211,0.25)">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
          <a href="{{ l.h }}" style="display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid rgba(243,230,211,0.25);color:var(--papir)"><span class="lbl" style="opacity:0.6">{{ l.n }}</span><span style="font-family:var(--serif);font-style:italic;font-size:clamp(40px,11vw,64px);line-height:1.05">{{ l.t }}</span></a>
        </sc-for>
      </nav>
      <p class="lbl" style="margin:24px 0 0;opacity:0.7">Laze Telečkog 14 · 021 000 000 · 12—24h</p>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;meni&quot;,&quot;vina&quot;,&quot;prica&quot;,&quot;dogadjaji&quot;,&quot;proslave&quot;,&quot;kontakt&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || '';
    const k = ['meni','vina','prica','dogadjaji','proslave','kontakt'];
    const c = {}, col = {};
    k.forEach(x => { c[x] = x === a ? 'page' : undefined; col[x] = x === a ? 'var(--bordo)' : 'var(--ink)'; });
    return { c, col, links: [
      {n:'01',t:'Meni',h:'meni.html'},{n:'02',t:'Vina',h:'vina.html'},{n:'03',t:'Priča',h:'prica.html'},
      {n:'04',t:'Događaji',h:'dogadjaji.html'},{n:'05',t:'Proslave',h:'proslave.html'},{n:'06',t:'Kontakt',h:'kontakt.html'},{n:'07',t:'Rezervacija',h:'rezervacija.html'}] };
  }
}
</script>
</body>
</html>
