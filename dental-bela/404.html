<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="BelaHeader" active="" hint-size="100%,124px"></dc-import>
<main class="mm" style="position:relative;overflow:hidden;min-height:82svh;padding:clamp(48px,10svh,120px) 0">
  <div class="g12" style="position:relative;row-gap:40px;align-items:center">
    <div style="grid-column:1 / span 6">
      <span class="mn" style="color:var(--plava)">Greška 404 · Zub br. 404</span>
      <h1 style="font-weight:800;font-size:clamp(72px,9vw,168px);line-height:0.88;letter-spacing:-0.055em;margin:20px 0 0">Ovaj zub<br><span style="color:var(--plava)">nismo pronašli.</span></h1>
      <p style="font-size:17px;line-height:1.65;color:var(--ink2);max-width:40ch;margin:24px 0 0">Stranica koju tražiš ne postoji. Svih ostalih 32 zuba su na svom mestu.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:32px">
        <a class="hv" href="zakazivanje.html" style="display:inline-flex;align-items:center;min-height:56px;padding:0 26px;border-radius:999px;background:var(--plava);color:#fff;font-weight:700" style-hover="background:var(--plava2);color:#fff">Zakaži pregled →</a>
        <a class="hv mn" href="index.html" style="display:inline-flex;align-items:center;min-height:56px;padding:0 22px;border-radius:999px;border:1px solid var(--ink)" style-hover="background:var(--ink);color:#fff">Početna</a>
      </div>
    </div>
    <figure style="grid-column:8 / span 5;margin:0;background:#fff;border-radius:28px;border:1px solid var(--line);padding:clamp(20px,2.4vw,32px)" role="img" aria-label="Zubna karta sa 32 zuba, jedno mesto obeleženo kao 404">
      <div style="display:flex;justify-content:space-between"><span style="font-weight:800">Zubna karta</span><span class="mn" style="color:var(--plava)">FDI · 32</span></div>
      <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:18px">
        <sc-for list="{{ gore }}" as="z" hint-placeholder-count="16"><span style="aspect-ratio:3/4;border-radius:10px 10px 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:var(--mono);font-size:10px;background:{{ z.bg }};color:{{ z.c }};border:{{ z.b }}">{{ z.n }}</span></sc-for>
      </div>
      <div style="height:1px;background:var(--ink);margin:12px 0"></div>
      <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px">
        <sc-for list="{{ dole }}" as="z" hint-placeholder-count="16"><span style="aspect-ratio:3/4;border-radius:6px 6px 10px 10px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;font-family:var(--mono);font-size:10px;background:{{ z.bg }};color:{{ z.c }};border:{{ z.b }}">{{ z.n }}</span></sc-for>
      </div>
      <figcaption class="mn" style="color:var(--ink2);margin-top:16px;display:flex;justify-content:space-between"><span>Sl. 404 — nalaz</span><span style="color:var(--plava)">■ 404 · nije pronađen</span></figcaption>
    </figure>
  </div>
</main>
<dc-import name="BelaFooter" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ok = n => ({ n, bg:'#EEF3FB', c:'var(--ink2)', b:'1px solid var(--line)' });
    const miss = { n:'404', bg:'transparent', c:'var(--plava)', b:'2px dashed var(--plava)' };
    const gore = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28].map(String).map(ok);
    const dole = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38].map(String).map(ok);
    gore[5] = miss;
    return { gore: gore.slice(0,8).concat(gore.slice(8)), dole };
  }
}
</script>
</body>
</html>
