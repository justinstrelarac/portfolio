<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<main>
  <section style="position:relative;overflow:hidden;min-height:clamp(560px,86svh,900px);display:flex;align-items:flex-end">
    <dc-import name="MonoTunel" noc="{{ a.noc }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
    <div role="img" aria-label="{{ a.alt }}" class="hm" style="position:absolute;right:8vw;bottom:0;width:clamp(200px,22vw,380px);height:74%;border-radius:999px 999px 0 0;background:{{ a.stub }};box-shadow:0 0 120px {{ a.c }}"></div>
    <div class="g12" style="position:relative;width:100%;padding-bottom:clamp(40px,8svh,80px);row-gap:16px">
      <div style="grid-column:1 / span 9"><a class="mo" href="izvodjaci.html" style="color:var(--siva)">← Izvođači</a><span class="mo" style="color:{{ a.c }};margin-left:14px;text-shadow:0 0 14px {{ a.c }}">{{ a.dan }} · {{ a.v }} · bina Monolit</span>
        <h1 class="d {{ a.g }}" style="font-size:clamp(110px,16vw,300px);margin:16px 0 0">{{ a.t }}</h1>
        <p style="font-family:var(--serif);font-style:italic;font-size:clamp(26px,2.8vw,48px);line-height:1.1;margin:10px 0 0;max-width:24ch">{{ a.lead }}</p></div>
    </div>
  </section>
  <section style="border-top:1px solid var(--line)">
    <div class="stk" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
      <sc-for list="{{ a.meta }}" as="m" hint-placeholder-count="4"><div style="padding:clamp(20px,2.4vw,32px);border-right:1px solid var(--line)"><div class="mo" style="color:var(--siva)">{{ m.k }}</div><div class="d" style="font-size:clamp(34px,3.2vw,56px);margin-top:10px">{{ m.v }}</div></div></sc-for>
    </div>
  </section>
  <section style="border-top:1px solid var(--line)">
    <div class="g12" style="padding-top:clamp(72px,14svh,150px);padding-bottom:clamp(72px,14svh,150px);row-gap:32px">
      <div class="rv" style="grid-column:1 / span 5;font-size:clamp(17px,1.4vw,20px);line-height:1.75;color:var(--tekst)"><p style="margin:0">{{ a.bio1 }}</p><p style="margin:20px 0 0;color:var(--siva)">{{ a.bio2 }}</p></div>
      <div class="rv" style="grid-column:7 / -1">
        <span class="mo" style="color:var(--siva)">Za zagrevanje · tri pesme</span>
        <ol style="list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)">
          <sc-for list="{{ a.pesme }}" as="p" hint-placeholder-count="3"><li style="display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)"><span class="mo" style="color:{{ a.c }}">{{ p.n }}</span><span class="d" style="font-size:clamp(28px,2.6vw,44px)">{{ p.t }}</span><span class="mo" style="color:var(--siva)">{{ p.d }}</span></li></sc-for>
        </ol>
      </div>
    </div>
  </section>
  <section style="position:relative;overflow:hidden;border-top:1px solid var(--line)">
    <div class="g12" style="padding-top:clamp(64px,12svh,130px);padding-bottom:clamp(64px,12svh,130px);row-gap:20px;align-items:end">
      <p class="rv d {{ a.g }}" style="grid-column:1 / span 8;font-size:clamp(64px,8vw,144px);margin:0">{{ a.cta }}</p>
      <div class="rv" style="grid-column:10 / span 3;display:flex;flex-direction:column;gap:10px"><a class="mo hv" href="ulaznice.html" style="display:flex;justify-content:center;align-items:center;min-height:56px;border-radius:999px;background:{{ a.c }};color:var(--noc)" style-hover="background:var(--tekst);color:var(--noc)">Ulaznica za {{ a.dan }} ↗</a><a class="mo hv" href="{{ a.nextH }}" style="display:flex;justify-content:center;align-items:center;min-height:52px;border-radius:999px;border:1px solid var(--line)" style-hover="border-color:var(--tekst)">Sledeći: {{ a.nextT }} →</a></div>
    </div>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;a&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic { renderVals() { return { a: Object.assign({ meta:[], pesme:[] }, this.props.a || {}) }; } }
</script>
</body>
</html>
