<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="MonoHeader" active="" hint-size="100%,116px"></dc-import>
<main style="position:relative;overflow:hidden;min-height:84svh;display:flex;align-items:center">
  <dc-import name="MonoTunel" noc="sub" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
  <div aria-hidden="true" style="position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:2vw;padding:0 8vw;opacity:0.55">
    <sc-for list="{{ masa }}" as="h" hint-placeholder-count="14"><span style="flex:1;max-width:60px;height:{{ h }};border-radius:999px 999px 0 0;background:#1A0E20"></span></sc-for>
  </div>
  <div class="g12" style="position:relative;width:100%;padding-top:clamp(56px,10svh,110px);padding-bottom:clamp(56px,10svh,110px);text-align:center">
    <div style="grid-column:1 / -1">
      <span class="mo" style="color:var(--sub);text-shadow:0 0 14px var(--sub)">Greška 404</span>
      <h1 class="d gS" style="font-size:clamp(100px,15vw,280px);margin:14px 0 0">Izgubio si se</h1>
      <p style="font-family:var(--serif);font-style:italic;font-size:clamp(32px,4vw,68px);line-height:1;margin:6px 0 0">u masi.</p>
      <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:32px"><a class="mo hv" href="index.html" style="display:inline-flex;align-items:center;min-height:54px;padding:0 24px;border-radius:999px;background:var(--pet2);color:var(--noc)" style-hover="background:var(--tekst);color:var(--noc)">Nazad ka bini</a><a class="mo hv" href="lokacija.html" style="display:inline-flex;align-items:center;min-height:54px;padding:0 22px;border-radius:999px;border:1px solid var(--line)" style-hover="border-color:var(--tekst)">Mapa festivala</a></div>
    </div>
  </div>
</main>
<dc-import name="MonoFooter" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic { renderVals() { return { masa: ['22%','30%','26%','34%','28%','38%','24%','32%','36%','27%','33%','25%','31%','29%'] }; } }
</script>
</body>
</html>
