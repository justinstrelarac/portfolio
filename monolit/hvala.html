<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="MonoHeader" active="" hint-size="100%,116px"></dc-import>
<main style="position:relative;overflow:hidden;min-height:86svh;display:flex;align-items:center">
  <dc-import name="MonoTunel" noc="ned" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
  <div class="g12" style="position:relative;width:100%;padding-top:clamp(56px,10svh,110px);padding-bottom:clamp(56px,10svh,110px);row-gap:36px;align-items:center">
    <div style="grid-column:1 / span 7">
      <span class="mo" style="color:var(--ned);text-shadow:0 0 14px var(--ned)">✓ Ulaznica je na mejlu</span>
      <h1 class="d gN" style="font-size:clamp(90px,13vw,240px);margin:14px 0 0">Vidimo se</h1>
      <p style="font-family:var(--serif);font-style:italic;font-size:clamp(34px,4.4vw,76px);line-height:1;margin:6px 0 0">na reci.</p>
      <p style="font-size:17px;line-height:1.6;color:var(--siva);max-width:42ch;margin:22px 0 0">Narukvica stiže poštom u julu. Do tada ti šaljemo satnicu i mapu, a dan pre festivala i vremensku prognozu.</p>
    </div>
    <div style="grid-column:8 / span 5;border-radius:24px;border:1px solid var(--ned);background:linear-gradient(135deg,rgba(59,123,255,0.2),rgba(7,4,10,0));box-shadow:0 0 70px rgba(59,123,255,0.4);display:grid;grid-template-columns:minmax(0,1fr) 110px;overflow:hidden;transform:rotate(-3deg)">
      <div style="padding:24px"><span class="mo" style="color:var(--siva)">Ulaznica · {{ n }} kom</span><div class="d" style="font-size:clamp(48px,5vw,84px);margin-top:10px">{{ k }}</div><div class="mo" style="margin-top:12px;color:var(--siva)">Ušće, Beograd · №{{ br }}</div></div>
      <div style="border-left:2px dashed rgba(242,237,230,0.35);display:flex;align-items:center;justify-content:center"><span class="mo" style="writing-mode:vertical-rl;letter-spacing:0.3em;color:var(--ned)">MONOLIT '27</span></div>
    </div>
  </div>
</main>
<dc-import name="MonoFooter" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic { renderVals() { let q; try { q = new URLSearchParams(window.location.search); } catch(e) { q = new URLSearchParams(''); } return { k: q.get('k') || '14—16.08', n: q.get('n') || '1', br: q.get('br') || '0427' }; } }
</script>
</body>
</html>
