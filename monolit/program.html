<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="MonoHeader" active="program" hint-size="100%,116px"></dc-import>
<main>
  <section style="position:relative;overflow:hidden;border-bottom:1px solid var(--line)">
    <dc-import name="MonoTunel" noc="{{ noc }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
    <div class="g12" style="position:relative;padding-top:clamp(48px,9svh,100px);padding-bottom:clamp(40px,7svh,72px);row-gap:20px;align-items:end">
      <h1 class="d {{ g }}" style="grid-column:1 / span 8;font-size:clamp(120px,18vw,320px);margin:0">Satnica</h1>
      <div style="grid-column:9 / span 4;display:flex;gap:8px;flex-wrap:wrap" role="tablist" aria-label="Izbor noći">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" class="mo hv" style="min-height:48px;padding:0 18px;border-radius:999px;cursor:pointer;background:{{ t.bg }};color:{{ t.c }};border:1px solid {{ t.bc }};box-shadow:{{ t.sh }}">{{ t.t }}</button></sc-for>
      </div>
    </div>
  </section>
  <section class="om" style="border-bottom:1px solid var(--line)">
    <sc-for list="{{ bine }}" as="b" hint-placeholder-count="3">
      <div style="padding:22px var(--m) 8px;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="d" style="font-size:40px">{{ b.t }}</span><span class="mo" style="color:var(--siva);font-size:10px">{{ b.d }}</span></div>
        <sc-for list="{{ b.s }}" as="s" hint-placeholder-count="3"><a href="{{ s.h }}" style="display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line)"><span class="mo" style="color:var(--siva)">{{ s.start }}</span><span style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:{{ s.bg }};border:1px solid {{ s.bc }}"><span class="d" style="font-size:24px">{{ s.t }}</span><span class="mo" style="font-size:10px;color:var(--siva)">{{ s.len }}</span></span></a></sc-for>
      </div>
    </sc-for>
  </section>
  <section class="hm" style="overflow-x:auto;border-bottom:1px solid var(--line)">
    <div style="min-width:980px;padding:0 var(--m)">
      <div style="display:grid;grid-template-columns:140px repeat(10,minmax(0,1fr));border-bottom:1px solid var(--line)"><span></span><sc-for list="{{ sati }}" as="h" hint-placeholder-count="10"><span class="mo" style="padding:14px 6px;color:var(--siva);border-left:1px solid var(--line)">{{ h }}</span></sc-for></div>
      <sc-for list="{{ bine }}" as="b" hint-placeholder-count="3">
        <div style="position:relative;display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid var(--line);min-height:110px">
          <div style="padding:16px 0"><div class="d" style="font-size:30px">{{ b.t }}</div><div class="mo" style="color:var(--siva);margin-top:6px;font-size:10px">{{ b.d }}</div></div>
          <div style="position:relative">
            <sc-for list="{{ b.s }}" as="s" hint-placeholder-count="4">
              <a href="{{ s.h }}" class="hv" style="position:absolute;top:14px;bottom:14px;left:{{ s.l }};width:{{ s.w }};border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:{{ s.bg }};border:1px solid {{ s.bc }};box-shadow:{{ s.sh }}" style-hover="background:rgba(242,237,230,0.12)"><span class="d" style="font-size:22px;white-space:nowrap">{{ s.t }}</span><span class="mo" style="font-size:10px;color:var(--siva);white-space:nowrap">{{ s.v }}</span></a>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
  <section><div class="g12" style="padding-top:clamp(64px,12svh,130px);padding-bottom:clamp(64px,12svh,130px);row-gap:20px;align-items:end"><p class="rv" style="grid-column:1 / span 8;font-family:var(--serif);font-style:italic;font-size:clamp(34px,4vw,72px);line-height:1.05;margin:0">Satnica se objavljuje nedelju dana pre festivala. <span style="color:var(--pet2)">Ovo je prva verzija.</span></p><div class="rv" style="grid-column:10 / span 3"><a class="mo hv" href="ulaznice.html" style="display:flex;justify-content:center;align-items:center;min-height:56px;border-radius:999px;background:var(--pet2);color:var(--noc)" style-hover="background:var(--tekst);color:var(--noc)">Kupi ulaznicu ↗</a></div></div></section>
</main>
<dc-import name="MonoFooter" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
const C = {pet:'#FF7A1A',sub:'#D6246E',ned:'#3B7BFF'};
const D = {
  pet:{sati:['20','21','22','23','00','01','02','03','04','05'],bine:[{t:'Monolit',d:'glavna · 12.000',s:[['Krug',20,1.5],['Kolektiv Sever',21.5,2],['Ana Voss',23.5,2.5,'ana-voss'],['Lumen 44',2,2.5]]},{t:'Obala',d:'uz reku · 3.000',s:[['Nada B',20,2],['Tamni talas',22,2],['Luka Rem',0,3]]},{t:'Tunel',d:'zatvorena · 800',s:[['Oblak B2B Zvon',22,4],['Zvon solo',2,3]]}]},
  sub:{sati:['20','21','22','23','00','01','02','03','04','05'],bine:[{t:'Monolit',d:'glavna · 12.000',s:[['Sova',20,1.5],['Dunav Sound System',21.5,2],['Mira Ilić',23.5,2.5,'mira-ilic'],['Vera Kiš',2,3]]},{t:'Obala',d:'uz reku · 3.000',s:[['Metar',20,2.5],['Jana Liv',22.5,2.5],['Ritam 11',1,3]]},{t:'Tunel',d:'zatvorena · 800',s:[['Ultra Nisko',23,4],['Kosa',3,2]]}]},
  ned:{sati:['18','19','20','21','22','23','00','01','02','03'],bine:[{t:'Monolit',d:'glavna · 12.000',s:[['Horizont',18,2],['Plavi čas',20,2],['Tiha Noć',22,4]]},{t:'Obala',d:'uz reku · 3.000',s:[['Mirna Luka',18,3],['Most',21,3],['Senka live',0,2]]},{t:'Tunel',d:'zatvorena',s:[['Zatvoreno',18,10]]}]}
};
const hm = x => String(Math.floor(x % 24)).padStart(2,'0') + ':' + (x % 1 ? '30' : '00');
class Component extends DCLogic {
  state = { n:'pet' };
  renderVals() {
    const n = this.state.n, d = D[n], c = C[n], start = +d.sati[0];
    const pos = h => { let x = h - start; if (x < 0) x += 24; return x; };
    return {
      noc: n, g: n === 'pet' ? 'gP' : (n === 'sub' ? 'gS' : 'gN'), sati: d.sati.map(h => h + ':00'),
      tabs: [['pet','Petak 14.08'],['sub','Subota 15.08'],['ned','Nedelja 16.08']].map(([id,t]) => ({ t, on: String(n === id), pick: () => this.setState({ n: id }), bg: n === id ? C[id] : 'transparent', c: n === id ? '#07040A' : 'var(--tekst)', bc: n === id ? C[id] : 'var(--line)', sh: n === id ? '0 0 24px ' + C[id] : 'none' })),
      bine: d.bine.map(b => ({ t: b.t, d: b.d, s: b.s.map(s => ({ t: s[0], start: hm(s[1]), len: String(s[2]).replace('.', ',') + 'h', v: hm(s[1]) + ' · ' + s[2] + 'h', l: 'calc(' + (pos(s[1]) / 10 * 100) + '% + 3px)', w: 'calc(' + (s[2] / 10 * 100) + '% - 6px)', h: s[3] ? s[3] + '.dc.html' : 'izvodjaci.html', bg: s[3] ? c + '33' : 'rgba(242,237,230,0.04)', bc: s[3] ? c : 'var(--line)', sh: s[3] ? '0 0 26px ' + c + '66' : 'none' })) }))
    };
  }
}
</script>
</body>
</html>
