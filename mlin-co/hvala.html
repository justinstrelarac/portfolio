<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="MlinHeader" active="" hint-size="100%,160px"></dc-import>
<main style="background:var(--zalfija);padding:clamp(48px,9svh,110px) 0 clamp(96px,18svh,200px)">
  <div class="g12" style="row-gap:40px;align-items:center">
    <div style="grid-column:1 / span 7">
      <span class="mm">✓ Porudžbina #{{ br }} je primljena</span>
      <h1 class="sf" style="font-weight:800;font-size:clamp(72px,9vw,168px);line-height:0.88;letter-spacing:-0.05em;margin:14px 0 0">Paket se pakuje. <span style="font-style:italic;font-weight:600;color:var(--tera)">Miriše već.</span></h1>
      <p style="font-size:18px;line-height:1.6;max-width:42ch;margin:22px 0 0">Hvala, {{ ime }}. Kad paket krene, stiže ti poruka sa brojem za praćenje. U {{ grad }} je za 1—2 dana.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:28px"><a class="hv" href="prodavnica.html" style="display:inline-flex;align-items:center;min-height:56px;padding:0 26px;border-radius:999px;background:var(--ink);color:var(--krem);font-weight:700" style-hover="background:var(--tera);color:#fff">Nazad u prodavnicu</a><a class="hv" href="prica.html" style="display:inline-flex;align-items:center;min-height:56px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);font-weight:500" style-hover="background:var(--ink);color:var(--krem)">Ko pakuje tvoj paket →</a></div>
    </div>
    <div style="grid-column:9 / span 4;display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ tok }}" as="t" hint-placeholder-count="3"><div style="display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:24px;background:{{ t.bg }};box-shadow:0 20px 40px -26px rgba(58,42,34,0.5);transform:rotate({{ t.r }})"><span aria-hidden="true" style="width:40px;height:40px;flex:0 0 auto;border-radius:14px;background:{{ t.ib }};display:flex;align-items:center;justify-content:center">{{ t.i }}</span><span><span style="display:block;font-weight:700">{{ t.t }}</span><span class="mm" style="color:var(--muted)">{{ t.w }}</span></span></div></sc-for>
    </div>
  </div>
</main>
<dc-import name="MlinFooter" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { let q; try { q = new URLSearchParams(window.location.search); } catch(e) { q = new URLSearchParams(''); }
    return { br: q.get('br') || '2051', ime: q.get('ime') || 'draga', grad: q.get('grad') || 'tvoj grad',
      tok: [{t:'Porudžbina primljena',w:'sada',i:'✓',bg:'#fff',ib:'#CFE3CF',r:'-1deg'},{t:'Paket je krenuo!',w:'danas do 17h',i:'→',bg:'#FBF6EF',ib:'#F8E08E',r:'1deg'},{t:'Kako ti se dopada?',w:'za 5 dana',i:'★',bg:'#FBF6EF',ib:'#F6C9D0',r:'-0.5deg'}] }; }
}
</script>
</body>
</html>
