<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  details.mq summary{list-style:none;cursor:pointer}
  details.mq summary::-webkit-details-marker{display:none}
  details.mq[open] .pl{transform:rotate(45deg)}
  details.mq .pl{transition:transform .25s ease}
  @media(prefers-reduced-motion:reduce){details.mq .pl{transition:none}}
</style>
</helmet>
<dc-import name="MlinHeader" active="dostava" hint-size="100%,160px"></dc-import>
<main>
  <section style="padding:clamp(48px,9svh,110px) 0 clamp(40px,7svh,72px)">
    <div class="g12" style="row-gap:24px;align-items:end"><div style="grid-column:1 / span 8"><span class="mm" style="color:var(--tera)">Dostava i pitanja</span><h1 class="sf" style="font-weight:800;font-size:clamp(88px,12vw,220px);line-height:0.86;letter-spacing:-0.05em;margin:14px 0 0">Stiže <span style="font-style:italic;font-weight:600;color:var(--tera)">sutra.</span></h1></div><p style="grid-column:9 / span 4;font-size:16px;line-height:1.6;color:var(--muted);margin:0">Poručeno do 13h šaljemo isti dan. Paket je od kartona i papira, bez folije i stiropora.</p></div>
  </section>
  <section style="padding:0 var(--m) clamp(64px,12svh,130px)">
    <div class="stk" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
      <sc-for list="{{ kartice }}" as="k" hint-placeholder-count="3"><div class="rv" style="padding:clamp(22px,2.4vw,34px);border-radius:36px;background:{{ k.bg }};min-height:260px;display:flex;flex-direction:column;justify-content:space-between"><span class="mm">{{ k.k }}</span><span><span class="sf" style="display:block;font-weight:900;font-size:clamp(52px,5vw,88px);line-height:0.85;letter-spacing:-0.04em">{{ k.v }}</span><span style="display:block;font-size:15px;margin-top:10px">{{ k.d }}</span></span></div></sc-for>
    </div>
  </section>
  <section style="padding:0 0 clamp(96px,18svh,200px)">
    <div class="g12" style="row-gap:24px">
      <h2 class="rv sf" style="grid-column:1 / span 4;font-weight:800;font-size:clamp(44px,4.6vw,80px);line-height:0.92;letter-spacing:-0.04em;margin:0">Pitanja <span style="font-style:italic;font-weight:600">koja stižu.</span></h2>
      <div style="grid-column:6 / -1;display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ faq }}" as="q" hint-placeholder-count="6">
          <details class="mq rv" style="border-radius:26px;background:var(--krem2);padding:0 24px">
            <summary style="display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:72px;font-family:var(--serif);font-weight:700;font-size:clamp(19px,1.7vw,24px)">{{ q.q }}<span class="pl" aria-hidden="true" style="flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--krem);display:flex;align-items:center;justify-content:center;font-size:20px">+</span></summary>
            <p style="margin:0 0 22px;font-size:16px;line-height:1.65;max-width:56ch">{{ q.a }}</p>
          </details>
        </sc-for>
      </div>
    </div>
  </section>
</main>
<dc-import name="MlinFooter" hint-size="100%,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {
    kartice:[{k:'Srbija',v:'1—2',d:'radna dana, BEX kurirom',bg:'#CFE3CF'},{k:'Dostava',v:'390',d:'dinara, besplatno iznad 3.000',bg:'#F8E08E'},{k:'Novi Sad',v:'0',d:'dinara, lično preuzimanje u radionici',bg:'#F6C9D0'}],
    faq:[{q:'Koliko traje jedan sapun?',a:'Oko šest nedelja uz svakodnevno korišćenje, ako ga držiš na podlozi koja se suši.'},{q:'Da li su sapuni veganski?',a:'Svi osim Meda i zobi, jer u njemu je bagremov med sa Fruške gore.'},{q:'Mogu li da vratim proizvod?',a:'Da, u roku od 14 dana, ako nije korišćen. Povraćaj novca stiže za 3 radna dana.'},{q:'Imam alergiju na eterična ulja.',a:'Piši nam pre poručivanja. Radimo i seriju bez mirisa, po dogovoru.'},{q:'Da li šaljete van Srbije?',a:'Za sada samo u Srbiji. Region je u planu za 2027.'},{q:'Kako da pratim paket?',a:'Čim paket krene, dobiješ poruku sa brojem za praćenje.'}]
  }; }
}
</script>
</body>
</html>
